# Deploy config for the Market Watch Worker (Cloudflare).
# Secrets are NOT stored here. Set them in the Cloudflare dashboard or with `wrangler secret put NAME`:
#   FINNHUB_KEY, TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, ANTHROPIC_API_KEY, ADMIN_TOKEN, ALPACA_KEY_ID, ALPACA_SECRET_KEY
name = "market-watch"
main = "worker.js"
compatibility_date = "2026-10-01"

[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "0d6ee582083349e59a1099417749af9c"

[[d1_databases]]
binding = "DB"
database_name = "market-watch-db"
database_id = "ff46829e-e63c-4173-827f-9a62aed329a9"
